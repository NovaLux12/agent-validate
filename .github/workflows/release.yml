name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # The asset names below are the ones the README's install command
      # downloads, and the ones v0.2.0 already published. They are raw
      # binaries, not archives — a `.tar.gz` has never existed for this repo,
      # so the README used to point at a URL that could never resolve.
      - name: Build
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.toolVersion=${GITHUB_REF_NAME}"
          GOOS=linux  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/agent-validate_linux_amd64   ./cmd/agent-validate
          GOOS=linux  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/agent-validate_linux_arm64   ./cmd/agent-validate
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/agent-validate_darwin_amd64  ./cmd/agent-validate
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/agent-validate_darwin_arm64  ./cmd/agent-validate
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/agent-validate_windows_amd64.exe ./cmd/agent-validate
          GOOS=windows GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/agent-validate_windows_arm64.exe ./cmd/agent-validate

      - name: Checksums
        run: |
          cd dist
          sha256sum agent-validate_* > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/agent-validate_linux_amd64
            dist/agent-validate_linux_arm64
            dist/agent-validate_darwin_amd64
            dist/agent-validate_darwin_arm64
            dist/agent-validate_windows_amd64.exe
            dist/agent-validate_windows_arm64.exe
            dist/SHA256SUMS
          generate_release_notes: true
